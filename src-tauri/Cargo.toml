[package]
name = "directssh"
version = "0.1.3"
description = "DirectSSH standalone Android SSH client"
authors = ["DirectSSH"]
license = "MIT"
repository = "https://github.com/smturtle2/DirectSSH"
edition = "2021"
rust-version = "1.85"

[lib]
name = "directssh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.22.1"
bytes = "1.11.0"
rand = "0.8.5"
russh = "0.61.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.11.2", features = [] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
