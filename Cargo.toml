[package]
name = "directssh"
version = "0.2.1"
description = "DirectSSH native Slint Android SSH client"
authors = ["DirectSSH"]
license = "MIT"
repository = "https://github.com/smturtle2/DirectSSH"
edition = "2021"
rust-version = "1.88"

[lib]
name = "directssh"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "directssh"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.22.1"
directories = "6.0.0"
rand = "0.8.5"
russh = "0.61.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
slint = { version = "1.16.1", features = ["backend-android-activity-06"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "sync", "time"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
vt100 = "0.16.2"

[build-dependencies]
slint-build = "1.16.1"

[package.metadata.android]
package = "dev.directssh.app"
build_targets = [
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "i686-linux-android",
  "x86_64-linux-android",
]
resources = "android/res"
apk_name = "DirectSSH"

[package.metadata.android.sdk]
min_sdk_version = 23
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application]
label = "DirectSSH"
icon = "@mipmap/ic_launcher"
theme = "@style/AppTheme"
